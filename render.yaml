# Render Blueprint — авто-деплой бэкенда
# Файл должен лежать в корне репозитория

services:
  - type: web
    name: smartplan-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: DATABASE_URL
        fromDatabase:
          name: smartplan-db
          property: connectionString

databases:
  - name: smartplan-db
    plan: free
    ipAllowList: []
