<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🏎 Дать газу · SmartPlan</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0b1220;font-family:Segoe UI,Roboto,sans-serif}
#map{position:absolute;inset:0;cursor:grab}
#map.dragging{cursor:grabbing}
#hud{position:absolute;left:14px;top:14px;z-index:20;background:rgba(15,23,42,.82);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.4);backdrop-filter:blur(8px);pointer-events:none;min-width:150px}
#hud .lbl{font-size:11px;color:#94a3b8;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
#speedo{font-size:30px;font-weight:800;color:#38bdf8;line-height:1}
#unit{font-size:13px;color:#94a3b8}
#boost{color:#fbbf24;font-weight:700;margin-left:6px}
#viewmode{display:inline-block;margin-top:6px;padding:2px 8px;border-radius:6px;background:#2563eb;font-size:11px;font-weight:700}
#help{position:absolute;right:14px;bottom:14px;z-index:20;background:rgba(15,23,42,.82);color:#cbd5e1;padding:10px 14px;border-radius:12px;font-size:11.5px;line-height:1.8;backdrop-filter:blur(8px);pointer-events:none}
#help kbd{background:#1e293b;border:1px solid #475569;border-radius:4px;padding:1px 6px;color:#fff;font-family:inherit;font-size:11px}
#dbg{position:absolute;left:14px;bottom:14px;z-index:21;background:rgba(15,23,42,.85);color:#fbbf24;padding:6px 12px;border-radius:8px;font-size:11.5px;font-family:monospace;pointer-events:none}
#note{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:22;background:rgba(22,163,74,.92);color:#fff;padding:8px 18px;border-radius:20px;font-size:12.5px;font-weight:600;display:none}
.maplibregl-ctrl-top-right{margin-top:64px!important}
</style>
</head>
<body>
<div id="map"></div>
<div id="hud"><div class="lbl">Скорость</div><div><span id="speedo">0</span> <span id="unit">км/ч</span><span id="boost"></span></div><div id="viewmode">CHASE · камера за авто</div></div>
<div id="help"><kbd>W</kbd>/<kbd>↑</kbd> газ · <kbd>S</kbd>/<kbd>↓</kbd> назад<br><kbd>A</kbd> <kbd>D</kbd> / <kbd>←</kbd> <kbd>→</kbd> руль · <kbd>Shift</kbd> турбо<br><kbd>Space</kbd> тормоз · <kbd>C</kbd> вид изнутри<br>мышь (тяни) — вращать камеру · колесо — зум</div>
<div id="dbg">кадр 0</div>
<div id="note"></div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";

var P = new URLSearchParams(location.search);
var START = [parseFloat(P.get("lat")) || 53.9060, parseFloat(P.get("lng")) || 27.6027];
var KEY = P.get("key") || "W7EjXYGEA3hzkGvx81JM";

// Твоя 3D-модель (meshopt), встроена в файл:
var CAR_B64 = "__CAR_B64__";
// Настройки модели (нормализованная Tripo): нос +X, верх +Y
var MODEL_ROT_X = Math.PI / 2, MODEL_ROT_Y = Math.PI / 2, MODEL_ROT_Z = 0;
var MODEL_SCALE = 4.7, MODEL_Z = 0.9; // 0.9 — поднять, чтобы колёса на асфальте (модель центрирована по высоте)

var map = new maplibregl.Map({
  container: "map",
  style: "https://api.maptiler.com/maps/streets-v2/style.json?key=" + KEY,
  center: [START[1], START[0]], zoom: 17, pitch: 62, bearing: 0,
  antialias: true, hash: false, maxPitch: 85, pitchWithRotate: false
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "top-right");
map.keyboard.disable();
map.dragPan.disable();
map.dragRotate.disable();
map.doubleClickZoom.disable();
map.touchZoomRotate.disable();

function setNote(t, ok) { var n = document.getElementById("note"); if (n) { n.textContent = t; n.style.background = (ok === false) ? "rgba(220,38,38,.92)" : "rgba(22,163,74,.92)"; n.style.display = t ? "block" : "none"; } }

var carState = { lat: START[0], lng: START[1], heading: 0, speed: 0 };
var viewMode = "chase";            // chase | interior
var orbitYaw = 0, orbitPitch = 62; // вращение камеры мышью (для chase)
var modelLoaded = false;

var carLayer = {
  id: "car3d", type: "custom", renderingMode: "3d",
  onAdd: function (m, gl) {
    console.log("[drive3d] carLayer.onAdd");
    this.map = m;
    this.camera = new THREE.Camera();
    this.scene = new THREE.Scene();
    this.scene.add(new THREE.AmbientLight(0xffffff, 0.9));
    var d1 = new THREE.DirectionalLight(0xffffff, 0.8); d1.position.set(1, 1, 2); this.scene.add(d1);
    var d2 = new THREE.DirectionalLight(0xffffff, 0.5); d2.position.set(-1, -1, 1); this.scene.add(d2);
    this.renderer = new THREE.WebGLRenderer({ canvas: m.getCanvas(), context: gl, antialias: true });
    this.renderer.autoClear = false;
    this.wrap = new THREE.Group(); this.scene.add(this.wrap);
    this.orient = new THREE.Group();
    this.orient.rotation.set(MODEL_ROT_X, MODEL_ROT_Y, MODEL_ROT_Z);
    this.orient.scale.setScalar(MODEL_SCALE);
    this.orient.position.z = MODEL_Z;
    this.wrap.add(this.orient);
    var self = this;
    // встроенная модель (base64) — грузится без сервера
    setNote("Распаковываю 3D-модель…");
    try {
      var bin = atob(CAR_B64);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      var loader = new GLTFLoader();
      loader.setMeshoptDecoder(MeshoptDecoder);
      loader.parse(bytes.buffer, "", function (gltf) {
        self.orient.add(gltf.scene);
        modelLoaded = true;
        console.log("[drive3d] модель загружена");
        setNote("3D-модель загружена ✓ — жми W/↑");
        setTimeout(function () { setNote(""); }, 3500);
      }, function (err) { console.error("[drive3d] ошибка модели", err); setNote("Ошибка модели: " + (err && err.message || err), false); });
    } catch (e) { console.error(e); setNote("Ошибка: " + e.message, false); }
  },
  render: function (gl, matrix) {
    this._fc = (this._fc || 0) + 1;
    var mc = maplibregl.MercatorCoordinate.fromLngLat([carState.lng, carState.lat], 0);
    var s = maplibregl.MercatorCoordinate.meterInMercatorUnits(carState.lat);
    var tr = new THREE.Matrix4().makeTranslation(mc.x, mc.y, mc.z);
    var sc = new THREE.Matrix4().makeScale(s, s, s);
    this.camera.projectionMatrix = new THREE.Matrix4().fromArray(matrix).multiply(tr).multiply(sc);
    if (this.wrap) this.wrap.rotation.z = -carState.heading;
    if (this.scene) this.scene.traverse(function (o) { o.frustumCulled = false; });
    this.renderer.resetState();
    this.renderer.render(this.scene, this.camera);
    var dbg = document.getElementById("dbg");
    if (dbg) dbg.textContent = "кадр " + this._fc + " · модель: " + (modelLoaded ? "да" : "…") + " · вид: " + viewMode;
    this.map.requestRepaint();
  }
};

map.on("load", function () {
  try {
    var st = map.getStyle(); var bs = null;
    for (var i = 0; i < st.layers.length; i++) { if (st.layers[i]["source-layer"] === "building") { bs = st.layers[i].source; break; } }
    if (bs) {
      map.addLayer({
        id: "3d-buildings", source: bs, "source-layer": "building", type: "fill-extrusion", minzoom: 14,
        paint: {
          "fill-extrusion-color": ["interpolate", ["linear"], ["coalesce", ["get", "render_height"], ["get", "height"], 5], 0, "#e6e8ec", 25, "#b8bfc9", 60, "#8a93a3"],
          "fill-extrusion-height": ["coalesce", ["get", "render_height"], ["get", "height"], 4],
          "fill-extrusion-base": ["coalesce", ["get", "render_min_height"], ["get", "min_height"], 0],
          "fill-extrusion-opacity": 0.92
        }
      });
    }
  } catch (e) { console.warn("здания:", e); }
  map.addLayer(carLayer);
});

// === Управление ===
var keys = {};
window.addEventListener("keydown", function (e) {
  keys[e.code] = true;
  if (e.code === "KeyC") { viewMode = (viewMode === "chase") ? "interior" : "chase"; }
  if (e.code === "Space" || e.code.indexOf("Arrow") === 0) e.preventDefault();
});
window.addEventListener("keyup", function (e) { keys[e.code] = false; });

// Мышь — вращение камеры (в режиме chase)
var dragging = false, lx = 0, ly = 0;
function initMouse() {
  var c = map.getCanvas();
  c.addEventListener("mousedown", function (e) { if (e.button === 0) { dragging = true; lx = e.clientX; ly = e.clientY; c.classList.add("dragging"); } });
  window.addEventListener("mousemove", function (e) {
    if (!dragging) return;
    orbitYaw += (e.clientX - lx) * 0.30;
    orbitPitch = Math.max(12, Math.min(84, orbitPitch + (e.clientY - ly) * 0.18));
    lx = e.clientX; ly = e.clientY;
  });
  window.addEventListener("mouseup", function () { dragging = false; c.classList.remove("dragging"); });
}
map.on("load", initMouse);

// Физика + коллизия
var MAX = 13.9, BOOST = 27.8, ACC = 8.5, REV = 5, FR = 3.6;
function readIn() {
  var f = 0, s = 0;
  if (keys["KeyW"] || keys["ArrowUp"]) f++;
  if (keys["KeyS"] || keys["ArrowDown"]) f--;
  if (keys["KeyA"] || keys["ArrowLeft"]) s--;
  if (keys["KeyD"] || keys["ArrowRight"]) s++;
  return { f: f, s: s, boost: !!(keys["ShiftLeft"] || keys["ShiftRight"]), brake: !!keys["Space"] };
}
function step(dt) {
  var i = readIn();
  var mx = i.boost ? BOOST : MAX;
  carState.speed += i.f * ACC * dt;
  if (i.f === 0) { var fr = FR * dt; if (Math.abs(carState.speed) <= fr) carState.speed = 0; else carState.speed -= Math.sign(carState.speed) * fr; }
  if (i.brake) { var b = ACC * 2 * dt; if (Math.abs(carState.speed) <= b) carState.speed = 0; else carState.speed -= Math.sign(carState.speed) * b; }
  carState.speed = Math.max(-REV, Math.min(mx, carState.speed));
  var sr = 1.15 * dt * Math.min(1, Math.abs(carState.speed) / 3.5);
  carState.heading += i.s * sr * (carState.speed >= 0 ? 1 : -1);
  var dm = carState.speed * dt;
  var dE = dm * Math.sin(carState.heading), dN = dm * Math.cos(carState.heading);
  var newLat = carState.lat + dN / 111320;
  var newLng = carState.lng + dE / (111320 * Math.cos(carState.lat * Math.PI / 180));
  // коллизия со зданиями
  var blocked = false;
  try {
    if (map.getLayer("3d-buildings")) {
      var fLat = newLat + Math.cos(carState.heading) * 2.2 / 111320;
      var fLng = newLng + Math.sin(carState.heading) * 2.2 / (111320 * Math.cos(newLat * Math.PI / 180));
      var c = map.queryRenderedFeatures(map.project([newLng, newLat]), { layers: ["3d-buildings"] });
      var f = map.queryRenderedFeatures(map.project([fLng, fLat]), { layers: ["3d-buildings"] });
      var cur = map.queryRenderedFeatures(map.project([carState.lng, carState.lat]), { layers: ["3d-buildings"] });
      if (((c && c.length) || (f && f.length)) && !(cur && cur.length)) blocked = true;
    }
  } catch (e) {}
  if (blocked) carState.speed = -carState.speed * 0.25;
  else { carState.lat = newLat; carState.lng = newLng; }
}

var last = performance.now(), spEl, boostEl, vmEl;
function loop(now) {
  var dt = Math.min(0.05, (now - last) / 1000); last = now;
  step(dt);
  var bearing = carState.heading * 180 / Math.PI;
  if (viewMode === "interior") {
    map.jumpTo({ center: [carState.lng, carState.lat], bearing: bearing, pitch: 85, zoom: 19 });
    if (carLayer.orient) carLayer.orient.visible = false;
  } else {
    map.jumpTo({ center: [carState.lng, carState.lat], bearing: bearing - orbitYaw, pitch: orbitPitch, zoom: 17 });
    if (carLayer.orient) carLayer.orient.visible = true;
  }
  if (!spEl) spEl = document.getElementById("speedo");
  if (!boostEl) boostEl = document.getElementById("boost");
  if (!vmEl) vmEl = document.getElementById("viewmode");
  if (spEl) spEl.textContent = Math.round(Math.abs(carState.speed) * 3.6);
  if (boostEl) boostEl.textContent = (readIn().boost && carState.speed > 0.5) ? "ТУРБО" : "";
  if (vmEl) vmEl.textContent = (viewMode === "interior" ? "ВНУТРИ · вид из салона" : "CHASE · камера за авто");
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
