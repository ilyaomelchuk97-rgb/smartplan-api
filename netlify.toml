# Netlify — конфиг деплоя фронтенда

[build]
  publish = "uploads"
  command = "echo 'Фронтенд — статические файлы, сборка не нужна'"

# Базовые заголовки: обновляемые файлы приложения всегда проверяются на сервере
# (no-cache = браузер кэширует, но перед использованием сверяет версию —
#  обновления app.js видны сразу после деплоя)
[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "no-cache"

# Неизменяемая статика — долгий кэш (год): фон, логотип, иконки PWA, библиотека xlsx.
# Если файл когда-нибудь заменяется — меняется и имя (fon.webp → fon-v2.webp и т.п.)
[[headers]]
  for = "/fon.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/logo.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icon-192.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icon-512.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/xlsx.full.min.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service worker — никогда не кэшируется браузером надолго (иначе обновления PWA запаздывают)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# SPA-редиректы не нужны (одностраничное приложение)
